databases:
  - name: alt-tv-rewind-db
    plan: free
    databaseName: alt_tv_rewind
    user: alt_tv_rewind

services:
  - type: web
    name: alt-tv-rewind
    runtime: node
    plan: free
    region: oregon
    buildCommand: bun install && bunx prisma generate && bun run build
    preDeployCommand: bunx prisma db push --accept-data-loss
    startCommand: bun run start
    envVars:
      # `runtime: node` is required — there is no `runtime: bun`. Setting
      # BUN_VERSION makes Render's Node runtime use Bun for install/start.
      - key: BUN_VERSION
        value: 1.3.10
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: alt-tv-rewind-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
